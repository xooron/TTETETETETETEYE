  inset: 0;
  overflow: hidden;

.orb {

.orb-b { width: 260px; height: 260px; top: 38%; right: -110px; background: var(--orb-green); animation: drift-b 22s ease-in-out infinite alternate; }

.logo {

.by {

}

.rule {
  position: relative;
  height: 1px;
  margin-top: 14px;
  background: var(--glass-line);
  overflow: hidden;
}
.rule::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 80px;
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--orange), transparent);
  transform: translateX(-90px);
  animation: glint 6s ease-in-out infinite 1s;
}

.label {
  margin: 20px 2px 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  animation: fade 0.7s ease 0.15s both;
}

/* Slider */
.slider { margin-top: 16px; animation: fade 0.7s ease 0.15s both; }
.track {
  display: flex;
  gap: 10px;
  padding-inline: 6%;
  scroll-padding-inline: 6%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  cursor: grab;
}
.track::-webkit-scrollbar { display: none; }
.track.drag { cursor: grabbing; }
.slide {
  position: relative;
  flex: 0 0 100%;
  min-width: 0;
  max-width: 100%;
  aspect-ratio: 1.7;
  border-radius: 16px;
  overflow: hidden;
  scroll-snap-align: center;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  box-shadow: 0 10px 28px -12px var(--shadow);
}
.slide img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
.slide::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 1px 0 var(--glass-hi);
  pointer-events: none;
}
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.dot {
  width: 6px;
  height: 6px;
  padding: 0;

.dot:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

.copy:hover { background: var(--glass-hi); }

.copy:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.copy.ok { background: var(--green); color: var(--on-green); border-color: transparent; }

/* Cards */

.card {
  position: relative;

        '<div class="rname"><b>' + esc(it[1]) + '</b>' + (it[3] ? '<small>' + esc(it[3]) + '</small>' : '') + '</div>' +
        '<a class="go sm" href="' + esc(it[2]) + '" target="_blank" rel="noopener noreferrer">Перейти</a></div>';
    }).join('');
    return '<section class="group" style="--i:' + gi + '">' +
      '<div class="ghead"><div class="label">' + esc(g.title) + '</div>' + extra + '</div>' +
      (g.note ? '<p class="gnote">' + esc(g.note) + '</p>' : '') +
      '<div class="rows">' + rows + '</div></section>';
  }).join('');
  document.getElementById('groups').innerHTML = html;

  // Telegram Mini App hooks. They run only when the page is opened inside Telegram
  // and the Telegram WebApp script is present; elsewhere the page works as a normal site.
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0a0908');
      tg.setBackgroundColor('#0a0908');
    } catch (e) {}
  }

  // Slider: swipe on touch, drag with mouse, dots follow the scroll position.
  var track = document.getElementById('track');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));
  function step() { return track.children[0].offsetWidth + 10; }
  function current() { return Math.max(0, Math.min(dots.length - 1, Math.round(track.scrollLeft / step()))); }
  function sync() {
    var i = current();
    dots.forEach(function (d, k) { d.setAttribute('aria-current', k === i ? 'true' : 'false'); });
  }
  track.addEventListener('scroll', sync, { passive: true });
  dots.forEach(function (d, i) {
    d.addEventListener('click', function () { track.scrollTo({ left: i * step(), behavior: 'smooth' }); });
  });

  var down = false, startX = 0, startLeft = 0;
  track.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse') return;
    down = true;
    startX = e.clientX;
    startLeft = track.scrollLeft;
    track.style.scrollSnapType = 'none';
    track.classList.add('drag');
    try { track.setPointerCapture(e.pointerId); } catch (err) {}
  });
  track.addEventListener('pointermove', function (e) {
    if (down) track.scrollLeft = startLeft - (e.clientX - startX);
  });
  function endDrag() {
    if (!down) return;
    down = false;
    track.classList.remove('drag');
    var i = current();
    track.style.scrollSnapType = '';
    track.scrollTo({ left: i * step(), behavior: 'smooth' });
  }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  // Copy buttons (promo codes)
  function copyCode(btn) {
    var text = btn.getAttribute('data-code');
    if (!btn.hasAttribute('data-label')) btn.setAttribute('data-label', btn.textContent);
    function done(msg) {
      btn.textContent = msg;
      btn.classList.add('ok');
      clearTimeout(btn._t);
      btn._t = setTimeout(function () {
        btn.textContent = btn.getAttribute('data-label');
        btn.classList.remove('ok');
      }, 1600);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done(ok ? 'Скопировано' : 'Выделите код');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done('Скопировано'); }, fallback);
    } else {
      fallback();
    }
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;

    var copyBtn = t.closest('button.copy');
    if (copyBtn) { copyCode(copyBtn); return; }

    var a = t.closest('a.go');
    if (!a || !tg) return;
    ev.preventDefault();
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    var url = a.href;
    try {
      if (/^https?:\/\/(t\.me|telegram\.me)\//.test(url) && tg.openTelegramLink) {
        tg.openTelegramLink(url.replace('telegram.me', 't.me'));
      } else {
        tg.openLink(url);
      }
    } catch (e) { window.open(url, '_blank'); }
  });
})();
</script>

</body></html>
